name: Check both websites
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: bash scripts/cloud-setup.sh
      - run: npm run build
        env:
          SITE: https://tokyosol1992.github.io
          BASE: /
      - run: test -s dist/index.html && test -s dist/portfolio/index.html
