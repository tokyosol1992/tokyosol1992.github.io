<style>
/* 레이아웃(원본 1440×960 실측): 3D 비디오 케이스 상자(정면 책등 78 × 깊이 250 × 높이 465)를 3.5° 기울여 세운 서가. 선택한 상자는 -86° 돌아 표지가 정면. 넘김은 프레임마다 목표를 따라가는 감속(계수 0.068/60fps) */
:root {

  color-scheme: light;
}
* { box-sizing: border-box; }

  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .42  0 0 0 0 .36  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

/* 헤더 (서가와 상세 종이 위에 같은 모양으로 그린다) */
.top { position: absolute; z-index: 20; left: 0; right: 0; top: 0; padding: calc(28px + env(safe-area-inset-top, 0px)) var(--gr) 0 var(--gl); display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; }

/* 서가: 상자마다 자기 원근 */
.stage { position: absolute; inset: 0; z-index: 1; overflow: hidden; touch-action: pan-y; }
.shelf { position: absolute; left: 0; right: 0; top: 50%; height: 0; }
.box { position: absolute; left: 0; top: 0; width: 0; height: 0; }
.box::after { content: ''; position: absolute; left: calc(-34px * var(--s)); width: calc(68px * var(--s)); top: calc(228px * var(--s)); height: calc(70px * var(--s)); background: linear-gradient(rgba(60, 50, 40, 0.34), transparent); filter: blur(5px); pointer-events: none; opacity: var(--sh, 1); }
/* .cl: 상자의 화면 윤곽을 둥근 모서리로 자르는 2D 틀(그림자·▶ 버튼은 바깥에 둔다) */
.cl { position: absolute; left: var(--cx, 0); top: var(--cy, 0); width: 0; height: 0; }
/* .rf: 바닥 반사 틀. 아래 변이 책의 가장 낮은 점(바닥선)에 오도록 JS가 높이를 맞추고, 그 선을 기준으로 거울처럼 비춘다.
   기운 책(.cl 회전)을 감싼 바깥에서 비추므로 반사는 바닥에 맞게 반대로 기운다. 지원하지 않는 브라우저는 기존 그림자를 쓴다 */
.rf { position: absolute; }
.box.off { visibility: hidden; } /* 화면 밖 책은 그리지 않는다 */
@supports (-webkit-box-reflect: below) {
  .rf { -webkit-box-reflect: below 0 linear-gradient(transparent 80%, rgba(255, 255, 255, 0.05) 88%, rgba(255, 255, 255, 0.2)); }
  .box::after { display: none; }
}
.rot { position: absolute; left: calc(-39px * var(--s)); top: calc(-232.5px * var(--s)); width: calc(78px * var(--s)); height: calc(465px * var(--s)); transform-style: preserve-3d; cursor: pointer; }
.face { position: absolute; top: 0; height: 100%; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; }
.fr { left: 0; width: 100%; transform: translateZ(calc(125px * var(--s))); background: linear-gradient(180deg, var(--t1), var(--t2)); color: var(--tx);
  box-shadow: inset 0 2px 3px rgba(255, 255, 255, 0.18), inset 0 -3px 5px rgba(0, 0, 0, 0.3); }
/* 책등은 위·아래만 평평하게 마감한다. 좌우는 표지·뒷면과 직각으로 맞물리는 이음매라 둥글리지 않는다 */
.fr::before { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0, 0, 0, 0.12), transparent 10%, transparent 90%, rgba(0, 0, 0, 0.14)); }
.fr .art { position: absolute; left: 50%; top: 4.5%; transform: translateX(-50%); }
.fr .ttl { position: absolute; left: 0; right: 0; top: 36%; bottom: 14%; display: flex; align-items: center; justify-content: center; writing-mode: vertical-rl; text-orientation: sideways; white-space: nowrap; font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: calc(22px * var(--s)); letter-spacing: 0.02em; }

.fr .mk i { font-style: normal; font-size: calc(7.5px * var(--s)); font-weight: 600; letter-spacing: 0.2em; opacity: 0.85; }
.fr .mk b { font-family: var(--display); font-weight: 700; font-size: calc(10px * var(--s)); padding: calc(2px * var(--s)) calc(5px * var(--s)); border: 1px solid currentColor; opacity: 0.9; letter-spacing: 0.04em; }
.sd { left: calc(-86px * var(--s)); width: calc(250px * var(--s)); }
/* 표지(오른쪽 면)는 책등과 닿는 왼쪽이 직각, 바깥쪽(오른쪽)만 둥글다. 뒷면(왼쪽 면)은 반대 */
.cvf { transform: rotateY(90deg) translateZ(calc(39px * var(--s))); }
.bkf { transform: rotateY(-90deg) translateZ(calc(39px * var(--s))); background: linear-gradient(180deg, var(--t2), var(--t3)); }
.bkf::after { content: ''; position: absolute; inset: 8% 10%; border: 1px solid rgba(255, 255, 255, 0.1); }
.cv { position: absolute; inset: 0; background: var(--cp); color: var(--ci); overflow: hidden; }
.d-cv .cv { border-radius: calc(11px * var(--cs, 1)); }

/* 헤진 서가: 가장자리·모서리의 때(어두운 얼룩)와 닳아 밝아진 긁힘, 누렇게 바랜 종이. 책마다 무늬 위치(--wx, --wy)를 달리한다 */
:root {
  --grime: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='720' height='720'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.028' numOctaves='4' seed='7' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .27  0 0 0 0 .2  0 0 0 0 .12  2.1 0 0 0 -.9'/></filter><rect width='100%' height='100%' filter='url(%23g)'/></svg>");
  --streak: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='480'><filter id='t'><feTurbulence type='fractalNoise' baseFrequency='.55 .006' numOctaves='3' seed='11' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .93  0 0 0 0 .89  0 0 0 0 .8  2.4 0 0 0 -1.62'/></filter><rect width='100%' height='100%' filter='url(%23t)'/></svg>");
  --mottle: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='720' height='720'><filter id='m'><feTurbulence type='fractalNoise' baseFrequency='.011' numOctaves='4' seed='23' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .36  0 0 0 0 .31  0 0 0 0 .24  1.5 0 0 0 -.55'/></filter><rect width='100%' height='100%' filter='url(%23m)'/></svg>");
  --foxing: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='720' height='720'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.12' numOctaves='2' seed='19' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42  0 0 0 0 .29  0 0 0 0 .15  18 0 0 0 -13.1'/></filter><rect width='100%' height='100%' filter='url(%23f)'/></svg>");
  --edge-mask: linear-gradient(90deg, #000, rgba(0,0,0,.35) 7%, transparent 16%, transparent 84%, rgba(0,0,0,.35) 93%, #000), linear-gradient(180deg, #000, rgba(0,0,0,.3) 4%, transparent 9%, transparent 91%, rgba(0,0,0,.3) 96%, #000), linear-gradient(rgba(0,0,0,var(--wall, .3)), rgba(0,0,0,var(--wall, .3)));
}
.wr { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
.wr::before, .wr::after { content: ''; position: absolute; inset: 0; background-position: var(--wx, 0) var(--wy, 0); }
.wr::before { background-image: var(--grime); opacity: var(--go, .55); -webkit-mask-image: var(--edge-mask); mask-image: var(--edge-mask); }
/* 원본처럼 가장자리 3~5px가 하얗게 닳아 일어나고(안쪽 경계는 실밥처럼 끊김) 모서리는 더 닳는다. 면 크기별 SVG는 JS(rub)가 책마다 만든다 */
.wr::after { background: var(--rub) center / 100% 100% no-repeat; opacity: var(--so, 1); }
.fr .wr { --rub: var(--rubF); } .bkf .wr, .cv .wr { --rub: var(--rubC); }
/* 책등: 위쪽이 햇빛에 바래고, 위·아래 끝이 닳아 하얗게 일어난다 */
.fr .wr { --go: .35; --so: .95; --wall: .15; background: var(--streak) var(--wx, 0) 0 / 240px 480px, linear-gradient(180deg, rgba(232, 220, 196, .14), transparent 26%); }
.bkf .wr { --go: .4; --so: .9; --wall: .2; background: var(--streak) var(--wy, 0) 0 / 240px 480px; }
/* 표지: 누렇게 바랜 종이, 갈색 반점, 가장자리 때 */
/* 상세의 큰 표지는 무늬도 같은 비율로 키워 서가에서 본 표지와 같은 헤짐으로 보이게 한다 */
.d-cv .wr { background-size: calc(720px * var(--cs, 1)), calc(720px * var(--cs, 1)), 100% 100%, 100% 100%; }
.d-cv .wr::before { background-size: calc(720px * var(--cs, 1)); }
.cv .wr { --go: .32; --so: .9; --wall: .3; background: var(--foxing) var(--wy, 0) var(--wx, 0), var(--mottle) var(--wx, 0) var(--wy, 0), radial-gradient(130% 100% at 50% 45%, transparent 55%, rgba(120, 88, 40, .16)), linear-gradient(rgba(176, 140, 72, .08), rgba(176, 140, 72, .08)); }

.cv .tag { position: absolute; left: 7%; top: 3.2%; font-family: var(--sans); font-weight: 600; font-size: calc(8.5px * var(--cs, var(--s))); letter-spacing: 0.14em; text-transform: uppercase; }
.cv h3 { position: absolute; left: 6%; right: 6%; top: 7.5%; margin: 0; text-align: center; font-family: var(--display); font-weight: 700; font-size: calc(43px * var(--cs, var(--s))); line-height: 0.96; letter-spacing: -0.01em; text-transform: uppercase; color: var(--ct); }
.cv .art { position: absolute; left: 50%; bottom: 7%; transform: translateX(-50%); }
.cv .mk { position: absolute; right: 7%; bottom: 3%; font-family: var(--display); font-weight: 700; font-size: calc(13px * var(--cs, var(--s))); padding: calc(2px * var(--cs, var(--s))) calc(7px * var(--cs, var(--s))); border: 1.5px solid currentColor; letter-spacing: 0.04em; z-index: 2; }
.cv .mk2 { position: absolute; left: 7%; bottom: 3.6%; font-family: var(--sans); font-weight: 600; font-size: calc(7.5px * var(--cs, var(--s))); letter-spacing: 0.2em; z-index: 2; }
.play { position: absolute; z-index: 5; width: calc(30px * var(--s)); height: calc(30px * var(--s)); border-radius: 50%; border: 1px solid var(--blue); background: var(--paper-2); color: var(--blue); display: flex; align-items: center; justify-content: center; pointer-events: none; opacity: 0; }
.play::before { content: ''; margin-left: 2px; border-left: calc(8px * var(--s)) solid currentColor; border-top: calc(5px * var(--s)) solid transparent; border-bottom: calc(5px * var(--s)) solid transparent; }

/* 하단 캡션 */
.cap { position: absolute; z-index: 10; left: 0; right: 0; top: calc(50% + 250px * var(--s) + 14px); text-align: center; pointer-events: none; }
.cap h2 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 30px; line-height: 1.1; }

.arr.l:hover { transform: translateX(-4px); } .arr.r:hover { transform: translateX(4px); }
.foot { position: absolute; z-index: 20; left: 0; right: 0; bottom: 0; padding: 0 var(--gr) calc(26px + env(safe-area-inset-bottom, 0px)) var(--gl); display: flex; justify-content: space-between; font-size: 10.5px; }
.foot a { color: inherit; text-decoration: none; }

/* 커서 */
.ring { position: fixed; z-index: 90; left: 0; top: 0; width: 58px; height: 58px; margin: -29px 0 0 -29px; border: 1px solid var(--ink); border-radius: 50%; pointer-events: none; display: none; align-items: center; justify-content: center; text-align: center;
  transition: width 0.3s var(--out), height 0.3s var(--out), margin 0.3s var(--out), background 0.3s, border-color 0.3s; font-weight: 600; font-size: 9px; letter-spacing: 0.08em; line-height: 1.3; color: #fff; }
.ring::before { content: ''; width: 4px; height: 4px; border-radius: 50%; background: var(--ink); transition: opacity 0.2s; }
.ring span { position: absolute; opacity: 0; transition: opacity 0.2s; }
.ring.open { width: 72px; height: 72px; margin: -36px 0 0 -36px; background: var(--blue); border-color: var(--blue); }
.ring.open::before { opacity: 0; } .ring.open span { opacity: 1; }
@media (hover: hover) and (pointer: fine) { .ring { display: flex; } }

/* 상세: 표지 자리에서 나오는 종이 */
/* 종이는 화면 크기 그대로 두고 clip-path 윤곽만 표지 자리에서 물결치며 퍼진다(상세 레이아웃은 처음부터 최종 자리) */
.sheet { position: fixed; z-index: 60; left: 0; top: 0; width: 100vw; height: 100vh; height: 100dvh; background: var(--paper-2); visibility: hidden; }
