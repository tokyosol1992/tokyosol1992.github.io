/* 레이아웃(원본 1440×960 실측): 3D 비디오 케이스 상자(정면 책등 78 × 깊이 250 × 높이 465)를 3.5° 기울여 세운 서가. 선택한 상자는 -86° 돌아 표지가 정면. 넘김은 프레임마다 목표를 따라가는 감속(계수 0.068/60fps) */
:root {
  --paper: #e7e5df; --paper-2: #f3f2ee; --ink: #0c0c0c; --blue: #1c3694; --mute: #6b6a66;
  /* 제목용 명조: 함렛 확정(2026-11-18). --kr-w: 책등·로고 굵기, --kr-h: 큰 제목 굵기 */
  --kr: 'Hahmlet', Georgia, serif; --kr-w: 700; /* 함렛: 제목(OSOL LIBRARY)과 영문 메뉴명만 */
  --ko: 'OsolSans', 'Noto Sans KR', system-ui, sans-serif; /* 한글: SUIT(파일 안에 쓰인 글자만 담은 부분 글꼴) */
  --display: 'Playfair Display', 'Noto Serif KR', Georgia, serif;
  --sans: 'Inter', 'OsolSans', 'Noto Sans KR', system-ui, sans-serif;
  --s: 1;
  --gl: max(16px, env(safe-area-inset-left, 0px)); --gr: max(16px, env(safe-area-inset-right, 0px));
  --out: cubic-bezier(0.16, 1, 0.3, 1);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); }
body { font-family: var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
.u { font-family: var(--sans); font-weight: 600; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; }
.paper { position: fixed; inset: 0; pointer-events: none; z-index: 80; opacity: 0.5; mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .42  0 0 0 0 .36  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

/* 헤더 (서가와 상세 종이 위에 같은 모양으로 그린다) */
.top { position: absolute; z-index: 20; left: 0; right: 0; top: 0; padding: calc(28px + env(safe-area-inset-top, 0px)) var(--gr) 0 var(--gl); display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; }
.btn { display: inline-block; border: 1px solid var(--ink); padding: 6px 9px 5px; line-height: 1; transition: background 0.2s, color 0.2s; color: var(--ink); text-decoration: none; }
.btn:hover { background: var(--ink); color: var(--paper); }
.logo { text-align: center; color: var(--blue); line-height: 1; }
.logo b { display: block; font-family: var(--kr); font-weight: var(--kr-w); font-size: 26px; letter-spacing: 0.08em; }
.logo i { display: block; margin-top: 6px; font-style: normal; font-family: var(--kr); font-weight: 600; font-size: 10px; letter-spacing: 0.34em; padding-left: 0.34em; }
.top .r { justify-self: end; padding-top: 7px; }
/* 서가 분류 메뉴: 유리(글래스모피즘) 알약. 원본처럼 파란 채움이 서가 위치를 따라 항목 사이를 연속으로 미끄러지고,
   채움이 덮은 부분의 글자만 흰색이 된다(흰 글자 층을 채움 모양으로 잘라 겹침) */
.snav { position: absolute; z-index: 20; left: 50%; top: calc(50% - 232px * var(--s) - 74px); transform: translateX(-50%); display: flex; padding: 4px; border-radius: 999px;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.58), rgba(255, 255, 255, 0.2)); border: 1px solid rgba(255, 255, 255, 0.75);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.95), inset 0 -1px 0 rgba(12, 12, 12, 0.05), 0 12px 32px rgba(60, 45, 30, 0.14), 0 1px 3px rgba(60, 45, 30, 0.12);
  -webkit-backdrop-filter: blur(16px) saturate(1.5); backdrop-filter: blur(16px) saturate(1.5); }
.snav button, .snav .hi span { position: relative; display: flex; align-items: center; height: 32px; padding: 0 17px; border-radius: 999px; white-space: nowrap; font-family: var(--ko); font-weight: 600; font-size: 12.5px; letter-spacing: -0.01em; color: rgba(12, 12, 12, 0.72); }
.snav .en, .snav .hi .en { font-family: var(--kr); font-weight: 700; font-size: 13.5px; letter-spacing: 0.02em; }
.snav button:hover { color: var(--ink); }
.snav button + button::before { content: ''; position: absolute; left: 0; top: 50%; width: 1px; height: 12px; margin-top: -6px; background: rgba(12, 12, 12, 0.16); }
.snav .ind { position: absolute; top: 4px; bottom: 4px; left: 0; width: 0; border-radius: 999px; pointer-events: none; will-change: transform, width;
  background: linear-gradient(180deg, #3552b8, var(--blue)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 4px 14px rgba(28, 54, 148, 0.35); }
.snav .hi { position: absolute; inset: 0; display: flex; padding: 4px; pointer-events: none; }
.snav .hi span { color: #fff; }


/* 서가: 상자마다 자기 원근 */
.stage { position: absolute; inset: 0; z-index: 1; overflow: hidden; touch-action: pan-y; }
.shelf { position: absolute; left: 0; right: 0; top: 50%; height: 0; }
.box { position: absolute; left: 0; top: 0; width: 0; height: 0; }
.box::after { content: ''; position: absolute; left: calc(-34px * var(--s)); width: calc(68px * var(--s)); top: calc(228px * var(--s)); height: calc(70px * var(--s)); background: linear-gradient(rgba(60, 50, 40, 0.34), transparent); filter: blur(5px); pointer-events: none; opacity: var(--sh, 1); }
/* .cl: 상자의 화면 윤곽을 둥근 모서리로 자르는 2D 틀(그림자·▶ 버튼은 바깥에 둔다) */
.cl { position: absolute; left: var(--cx, 0); top: var(--cy, 0); width: 0; height: 0; }
/* .rf: 바닥 반사 틀. 아래 변이 책의 가장 낮은 점(바닥선)에 오도록 JS가 높이를 맞추고, 그 선을 기준으로 거울처럼 비춘다.
   기운 책(.cl 회전)을 감싼 바깥에서 비추므로 반사는 바닥에 맞게 반대로 기운다. 지원하지 않는 브라우저는 기존 그림자를 쓴다 */
.rf { position: absolute; }
.box.off { visibility: hidden; } /* 화면 밖 책은 그리지 않는다 */
@supports (-webkit-box-reflect: below) {
  .rf { -webkit-box-reflect: below 0 linear-gradient(transparent 80%, rgba(255, 255, 255, 0.05) 88%, rgba(255, 255, 255, 0.2)); }
  .box::after { display: none; }
}
.rot { position: absolute; left: calc(-39px * var(--s)); top: calc(-232.5px * var(--s)); width: calc(78px * var(--s)); height: calc(465px * var(--s)); transform-style: preserve-3d; cursor: pointer; }
.face { position: absolute; top: 0; height: 100%; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; }
.fr { left: 0; width: 100%; transform: translateZ(calc(125px * var(--s))); background: linear-gradient(180deg, var(--t1), var(--t2)); color: var(--tx);
  box-shadow: inset 0 2px 3px rgba(255, 255, 255, 0.18), inset 0 -3px 5px rgba(0, 0, 0, 0.3); }
/* 책등은 위·아래만 평평하게 마감한다. 좌우는 표지·뒷면과 직각으로 맞물리는 이음매라 둥글리지 않는다 */
.fr::before { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0, 0, 0, 0.12), transparent 10%, transparent 90%, rgba(0, 0, 0, 0.14)); }
.fr .art { position: absolute; left: 50%; top: 4.5%; transform: translateX(-50%); }
.fr .ttl { position: absolute; left: 0; right: 0; top: 36%; bottom: 14%; display: flex; align-items: center; justify-content: center; writing-mode: vertical-rl; text-orientation: sideways; white-space: nowrap; font-family: var(--ko); font-weight: 800; font-size: calc(22px * var(--s)); letter-spacing: 0.02em; }
.fr .mk { position: absolute; left: 0; right: 0; bottom: calc(14px * var(--s)); display: flex; flex-direction: column; align-items: center; gap: calc(5px * var(--s)); }
.fr .mk i { font-style: normal; font-size: calc(7.5px * var(--s)); font-weight: 600; letter-spacing: 0.2em; opacity: 0.85; }
.fr .mk b { font-family: var(--display); font-weight: 700; font-size: calc(10px * var(--s)); padding: calc(2px * var(--s)) calc(5px * var(--s)); border: 1px solid currentColor; opacity: 0.9; letter-spacing: 0.04em; }
.sd { left: calc(-86px * var(--s)); width: calc(250px * var(--s)); }
/* 표지(오른쪽 면)는 책등과 닿는 왼쪽이 직각, 바깥쪽(오른쪽)만 둥글다. 뒷면(왼쪽 면)은 반대 */
.cvf { transform: rotateY(90deg) translateZ(calc(39px * var(--s))); }
.bkf { transform: rotateY(-90deg) translateZ(calc(39px * var(--s))); background: linear-gradient(180deg, var(--t2), var(--t3)); }
.bkf::after { content: ''; position: absolute; inset: 8% 10%; border: 1px solid rgba(255, 255, 255, 0.1); }
.cv { position: absolute; inset: 0; background: var(--cp); color: var(--ci); overflow: hidden; }
.d-cv .cv { border-radius: calc(11px * var(--cs, 1)); }

/* 헤진 서가: 가장자리·모서리의 때(어두운 얼룩)와 닳아 밝아진 긁힘, 누렇게 바랜 종이. 책마다 무늬 위치(--wx, --wy)를 달리한다 */
