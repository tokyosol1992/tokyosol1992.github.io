/* 레이아웃(원본 1440×960 실측): 3D 비디오 케이스 상자(정면 책등 78 × 깊이 250 × 높이 465)를 3.5° 기울여 세운 서가. 선택한 상자는 -86° 돌아 표지가 정면. 넘김은 프레임마다 목표를 따라가는 감속(계수 0.068/60fps) */
:root {
  --paper: #e7e5df; --paper-2: #f3f2ee; --ink: #0c0c0c; --blue: #1c3694; --mute: #6b6a66;
  /* 제목용 명조: 함렛 확정(2026-11-18). --kr-w: 책등·로고 굵기, --kr-h: 큰 제목 굵기 */
  --kr: 'Hahmlet', Georgia, serif; --kr-w: 700; /* 함렛: 제목(OSOL LIBRARY)과 영문 메뉴명만 */
  --ko: 'OsolSans', 'Noto Sans KR', system-ui, sans-serif; /* 한글: SUIT(파일 안에 쓰인 글자만 담은 부분 글꼴) */
  --display: 'Playfair Display', 'Noto Serif KR', Georgia, serif;
  --sans: 'Inter', 'OsolSans', 'Noto Sans KR', system-ui, sans-serif;
  --s: 1;
  --gl: max(16px, env(safe-area-inset-left, 0px)); --gr: max(16px, env(safe-area-inset-right, 0px));
  --out: cubic-bezier(0.16, 1, 0.3, 1);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); }
body { font-family: var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
.u { font-family: var(--sans); font-weight: 600; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; }
.paper { position: fixed; inset: 0; pointer-events: none; z-index: 80; opacity: 0.5; mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .42  0 0 0 0 .36  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

/* 헤더 (서가와 상세 종이 위에 같은 모양으로 그린다) */
.top { position: absolute; z-index: 20; left: 0; right: 0; top: 0; padding: calc(28px + env(safe-area-inset-top, 0px)) var(--gr) 0 var(--gl); display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; }
.btn { display: inline-block; border: 1px solid var(--ink); border-radius: 999px; padding: 8px 14px 7px; line-height: 1; transition: background 0.2s, color 0.2s; color: var(--ink); text-decoration: none; }
.btn:hover { background: var(--ink); color: var(--paper); }
.logo { text-align: center; color: var(--blue); line-height: 1; }
.logo b { display: block; font-family: var(--kr); font-weight: var(--kr-w); font-size: 26px; letter-spacing: 0.08em; }
.logo i { display: block; margin-top: 6px; font-style: normal; font-family: var(--kr); font-weight: 600; font-size: 10px; letter-spacing: 0.34em; padding-left: 0.34em; }
.top .r { justify-self: end; padding-top: 7px; }
/* 서가 분류 메뉴: 유리(글래스모피즘) 알약. 원본처럼 파란 채움이 서가 위치를 따라 항목 사이를 연속으로 미끄러지고,
   채움이 덮은 부분의 글자만 흰색이 된다(흰 글자 층을 채움 모양으로 잘라 겹침) */
/* 메뉴도 서가 비율(--s)로 줄인다. 글자가 너무 작아지지 않게 0.72배 아래로는 줄이지 않는다(--m0). 2026-11-19: 메뉴 크기를 30% 키움(--m = --m0 × 1.3), 표지와의 간격은 --m0 기준 그대로 */
.snav { --m0: max(var(--s), 0.72); --m: calc(var(--m0) * 1.3); position: absolute; z-index: 99; left: 50%; top: calc(50% - 250px * var(--s) - 2px - 40px * var(--m) - 32px * var(--m0)); /* 네 항목이 같은 좌우 여백으로 이어진 한 줄. 메뉴 크기는 서가 비율의 1.3배(--m), 선택 표지 윗변과의 간격은 그대로 32×m0 px(메뉴 높이 40×m + 테두리 2px + 간격 32×m0) */ transform: translateX(-50%); display: flex; padding: calc(4px * var(--m)); border-radius: 999px;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0) 55%, rgba(255, 255, 255, 0.05)); border: 1px solid rgba(255, 255, 255, 0.3);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.85), inset 0 -1px 1px rgba(255, 255, 255, 0.4), inset 1px 0 0 rgba(255, 255, 255, 0.35), inset -1px 0 0 rgba(255, 255, 255, 0.2), 0 12px 26px -8px rgba(60, 45, 30, 0.16), 0 1px 1px rgba(60, 45, 30, 0.08);
  -webkit-backdrop-filter: blur(4px) saturate(1.6); backdrop-filter: blur(4px) saturate(1.6); }
/* 유리 가장자리: 왼쪽 위가 밝고 오른쪽 아래로 옅어지는 빛 테두리 + 위쪽 사선 반사 */
.snav::before { content: ''; position: absolute; inset: -1px; border-radius: inherit; padding: 1px; pointer-events: none;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.15) 35%, rgba(255, 255, 255, 0.05) 65%, rgba(255, 255, 255, 0.6));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
.snav::after { content: ''; position: absolute; left: 3%; right: 3%; top: 2px; height: 40%; border-radius: 999px; pointer-events: none;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0)); }
/* 모든 항목에 같은 좌우 여백(30px): 칸 폭은 글자 길이에 따라 다르지만 글자 사이 여백은 모두 같다 */
.snav button, .snav .hi span { position: relative; display: flex; align-items: center; justify-content: center; flex: none; height: calc(32px * var(--m)); padding: 0 calc(30px * var(--m)); border-radius: 999px; white-space: nowrap; font-family: var(--ko); font-weight: 600; font-size: calc(12.5px * var(--m)); letter-spacing: -0.01em; color: rgba(12, 12, 12, 0.72); }
.snav button:hover { color: var(--ink); }
.snav button + button::before { content: ''; position: absolute; left: 0; top: 50%; width: 1px; height: calc(12px * var(--m)); margin-top: calc(-6px * var(--m)); background: rgba(12, 12, 12, 0.16); }
.snav .ind { position: absolute; top: calc(4px * var(--m)); bottom: calc(4px * var(--m)); left: 0; width: 0; border-radius: 999px; pointer-events: none; will-change: transform, width;
  background: linear-gradient(180deg, #3552b8, var(--blue)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 4px 14px rgba(28, 54, 148, 0.35); }
.snav .hi { position: absolute; inset: 0; display: flex; padding: calc(4px * var(--m)); pointer-events: none; }
.snav .hi span { color: #fff; }
/* 가운데 빈칸: 선택 표지(기운 폭 약 290×s)가 설 자리. 항목은 양옆 책등 위에 놓인다 */


/* 서가: 상자마다 자기 원근 */
.stage { position: absolute; inset: 0; z-index: 1; overflow: hidden; touch-action: pan-y; }
.shelf { position: absolute; left: 0; right: 0; top: 50%; height: 0; }
.box { position: absolute; left: 0; top: 0; width: 0; height: 0; }
.box::after { content: ''; position: absolute; left: calc(-34px * var(--s)); width: calc(68px * var(--s)); top: calc(228px * var(--s)); height: calc(70px * var(--s)); background: linear-gradient(rgba(60, 50, 40, 0.34), transparent); filter: blur(5px); pointer-events: none; opacity: var(--sh, 1); }
/* .cl: 상자의 화면 윤곽을 둥근 모서리로 자르는 2D 틀(그림자·▶ 버튼은 바깥에 둔다) */
.cl { position: absolute; left: var(--cx, 0); top: var(--cy, 0); width: 0; height: 0; }
/* .rf: 바닥 반사 틀. 아래 변이 책의 가장 낮은 점(바닥선)에 오도록 JS가 높이를 맞추고, 그 선을 기준으로 거울처럼 비춘다.
   기운 책(.cl 회전)을 감싼 바깥에서 비추므로 반사는 바닥에 맞게 반대로 기운다. 지원하지 않는 브라우저는 기존 그림자를 쓴다 */
.rf { position: absolute; }
.box.off { visibility: hidden; } /* 화면 밖 책은 그리지 않는다 */
@supports (-webkit-box-reflect: below) {
  .rf { -webkit-box-reflect: below 0 linear-gradient(transparent 80%, rgba(255, 255, 255, 0.05) 88%, rgba(255, 255, 255, 0.2)); }
  .box::after { display: none; }
}
.rot { position: absolute; left: calc(-39px * var(--s)); top: calc(-232.5px * var(--s)); width: calc(78px * var(--s)); height: calc(465px * var(--s)); transform-style: preserve-3d; cursor: pointer; }
.face { position: absolute; top: 0; height: 100%; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; }
.fr { left: 0; width: 100%; transform: translateZ(calc(125px * var(--s))); background: linear-gradient(180deg, var(--t1), var(--t2)); color: var(--tx);
  box-shadow: inset 0 2px 3px rgba(255, 255, 255, 0.18), inset 0 -3px 5px rgba(0, 0, 0, 0.3); }
/* 책등은 위·아래만 평평하게 마감한다. 좌우는 표지·뒷면과 직각으로 맞물리는 이음매라 둥글리지 않는다 */
.fr::before { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0, 0, 0, 0.12), transparent 10%, transparent 90%, rgba(0, 0, 0, 0.14)); }
.fr .art { position: absolute; left: 50%; top: 4.5%; transform: translateX(-50%); }
.fr .ttl { position: absolute; left: 0; right: 0; top: 36%; bottom: 14%; display: flex; align-items: center; justify-content: center; writing-mode: vertical-rl; text-orientation: sideways; white-space: nowrap; font-family: var(--ko); font-weight: 800; font-size: calc(22px * var(--s)); letter-spacing: 0.02em; }
.fr .mk { position: absolute; left: 0; right: 0; bottom: calc(14px * var(--s)); display: flex; flex-direction: column; align-items: center; gap: calc(5px * var(--s)); }
.fr .mk i { font-style: normal; font-size: calc(7.5px * var(--s)); font-weight: 600; letter-spacing: 0.2em; opacity: 0.85; }

.sd { left: calc(-86px * var(--s)); width: calc(250px * var(--s)); }
/* 표지(오른쪽 면)는 책등과 닿는 왼쪽이 직각, 바깥쪽(오른쪽)만 둥글다. 뒷면(왼쪽 면)은 반대 */
.cvf { transform: rotateY(90deg) translateZ(calc(39px * var(--s))); }

.cv { position: absolute; inset: 0; background: var(--cp); color: var(--ci); overflow: hidden; }

/* 헤진 서가: 가장자리·모서리의 때(어두운 얼룩)와 닳아 밝아진 긁힘, 누렇게 바랜 종이. 책마다 무늬 위치(--wx, --wy)를 달리한다 */
:root {
  --grime: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='720' height='720'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.028' numOctaves='4' seed='7' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .27  0 0 0 0 .2  0 0 0 0 .12  2.1 0 0 0 -.9'/></filter><rect width='100%' height='100%' filter='url(%23g)'/></svg>");
  --streak: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='480'><filter id='t'><feTurbulence type='fractalNoise' baseFrequency='.55 .006' numOctaves='3' seed='11' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .93  0 0 0 0 .89  0 0 0 0 .8  2.4 0 0 0 -1.62'/></filter><rect width='100%' height='100%' filter='url(%23t)'/></svg>");
  --mottle: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='720' height='720'><filter id='m'><feTurbulence type='fractalNoise' baseFrequency='.011' numOctaves='4' seed='23' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .36  0 0 0 0 .31  0 0 0 0 .24  1.5 0 0 0 -.55'/></filter><rect width='100%' height='100%' filter='url(%23m)'/></svg>");
  --foxing: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='720' height='720'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.12' numOctaves='2' seed='19' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42  0 0 0 0 .29  0 0 0 0 .15  18 0 0 0 -13.1'/></filter><rect width='100%' height='100%' filter='url(%23f)'/></svg>");
  --edge-mask: linear-gradient(90deg, #000, rgba(0,0,0,.35) 7%, transparent 16%, transparent 84%, rgba(0,0,0,.35) 93%, #000), linear-gradient(180deg, #000, rgba(0,0,0,.3) 4%, transparent 9%, transparent 91%, rgba(0,0,0,.3) 96%, #000), linear-gradient(rgba(0,0,0,var(--wall, .3)), rgba(0,0,0,var(--wall, .3)));
}
.wr { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
.wr::before, .wr::after { content: ''; position: absolute; inset: 0; background-position: var(--wx, 0) var(--wy, 0); }

/* 원본처럼 가장자리 3~5px가 하얗게 닳아 일어나고(안쪽 경계는 실밥처럼 끊김) 모서리는 더 닳는다. 면 크기별 SVG는 JS(rub)가 책마다 만든다 */
.wr::after { background: var(--rub) center / 100% 100% no-repeat; opacity: var(--so, 1); }

/* 책등: 위쪽이 햇빛에 바래고, 위·아래 끝이 닳아 하얗게 일어난다 */
.fr .wr { --go: .35; --so: .95; --wall: .15; background: var(--streak) var(--wx, 0) 0 / 240px 480px, linear-gradient(180deg, rgba(232, 220, 196, .14), transparent 26%); }
.bkf .wr { --go: .4; --so: .9; --wall: .2; background: var(--streak) var(--wy, 0) 0 / 240px 480px; }
/* 표지: 누렇게 바랜 종이, 갈색 반점, 가장자리 때 */
/* 상세의 큰 표지는 무늬도 같은 비율로 키워 서가에서 본 표지와 같은 헤짐으로 보이게 한다 */
.d-cv .wr { background-size: calc(720px * var(--cs, 1)), calc(720px * var(--cs, 1)), 100% 100%, 100% 100%; }
.d-cv .wr::before { background-size: calc(720px * var(--cs, 1)); }
.cv .wr { --go: .32; --so: .9; --wall: .3; background: var(--foxing) var(--wy, 0) var(--wx, 0), var(--mottle) var(--wx, 0) var(--wy, 0), radial-gradient(130% 100% at 50% 45%, transparent 55%, rgba(120, 88, 40, .16)), linear-gradient(rgba(176, 140, 72, .08), rgba(176, 140, 72, .08)); }
.cv::before { content: ''; position: absolute; inset: 0; background: radial-gradient(120% 90% at 30% 20%, rgba(255, 255, 255, 0.35), transparent 60%), linear-gradient(90deg, rgba(0, 0, 0, 0.14), transparent 8%, transparent 92%, rgba(0, 0, 0, 0.1)); pointer-events: none; z-index: 3; }
.cv .tag { position: absolute; left: 7%; top: 3.2%; font-family: var(--sans); font-weight: 600; font-size: calc(8.5px * var(--cs, var(--s))); letter-spacing: 0.14em; text-transform: uppercase; }
.cv h3 { position: absolute; left: 6%; right: 6%; top: 7.5%; margin: 0; text-align: center; font-family: var(--display); font-weight: 700; font-size: calc(43px * var(--cs, var(--s))); line-height: 0.96; letter-spacing: -0.01em; text-transform: uppercase; color: var(--ct); }
.cv .art { position: absolute; left: 50%; bottom: 7%; transform: translateX(-50%); }
.cv .mk { position: absolute; right: 7%; bottom: 3%; font-family: var(--display); font-weight: 700; font-size: calc(13px * var(--cs, var(--s))); padding: calc(2px * var(--cs, var(--s))) calc(7px * var(--cs, var(--s))); border: 1.5px solid currentColor; letter-spacing: 0.04em; z-index: 2; }
.cv .mk2 { position: absolute; left: 7%; bottom: 3.6%; font-family: var(--sans); font-weight: 600; font-size: calc(7.5px * var(--cs, var(--s))); letter-spacing: 0.2em; z-index: 2; }
/* 포스터 표지 템플릿(2026-11-19): 프로젝트 메인 화면을 포스터처럼 세운 표지. 종류 app(폰 틀)·web(브라우저 틀), 색은 --pb 배경 · --pf 글자 · --pa 포인트 */
.cv.pst { --u: var(--cs, var(--s)); background: var(--pb); color: var(--pf); }
.pst .pe { position: absolute; left: 7.2%; top: 3.4%; font-family: var(--sans); font-weight: 600; font-size: calc(8px * var(--u)); letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.85; z-index: 2; }
.cv.pst h3 { left: 7.2%; right: 8%; top: 8%; text-align: left; font-family: var(--ko); font-weight: 800; font-size: calc(27px * var(--u)); line-height: 1.14; letter-spacing: -0.02em; text-transform: none; word-break: keep-all; color: var(--pf); }
.pst .mk { top: 2.6%; bottom: auto; right: 6.4%; }
.pst .mk2 { display: none; }
.pst .wr { opacity: 0.55; } /* 포스터는 화면 글자가 읽히도록 종이 헤짐 얼룩을 옅게 */
.pst .dv { position: absolute; z-index: 1; background: #111; box-shadow: 0 calc(10px * var(--u)) calc(24px * var(--u)) rgba(0, 0, 0, 0.3), inset 0 0 0 1px rgba(255, 255, 255, 0.28); }
.pst .dv .sc { display: block; width: 100%; height: 100%; overflow: hidden; background: #fff center top / cover no-repeat; }
.pst .dv.app { left: 50%; top: 32%; width: 62%; aspect-ratio: 9 / 19.5; transform: translateX(-50%); padding: calc(4.5px * var(--u)); border-radius: calc(26px * var(--u)); }
.pst .dv.app .sc { border-radius: calc(21.5px * var(--u)); }
.pst .dv.kiosk { left: 50%; top: 33%; width: 54%; aspect-ratio: 9 / 16; transform: translateX(-50%); padding: calc(5px * var(--u)); border-radius: calc(11px * var(--u)); background: #e9e6df; box-shadow: 0 calc(10px * var(--u)) calc(24px * var(--u)) rgba(0, 0, 0, 0.3), inset 0 0 0 calc(2.5px * var(--u)) #1b1b1d; }
.pst .dv.kiosk .sc { border-radius: calc(5px * var(--u)); }
.pst .dv.kiosk::after { content: ''; position: absolute; left: 50%; top: 100%; width: 34%; height: calc(40px * var(--u)); transform: translateX(-50%); background: linear-gradient(90deg, #8e8a82, #c9c5bc 40%, #8e8a82); border-radius: 0 0 calc(4px * var(--u)) calc(4px * var(--u)); }
.pst .dv.web { left: 7.2%; right: 7.2%; top: 41%; padding: calc(15px * var(--u)) 0 0; border-radius: calc(8px * var(--u)); aspect-ratio: 16 / 11.4; background: #1d1d1f; }
.pst .dv.web::before { content: ''; position: absolute; left: calc(7px * var(--u)); top: calc(5px * var(--u)); width: calc(4px * var(--u)); height: calc(4px * var(--u)); border-radius: 50%; background: #ff5f57; box-shadow: calc(7px * var(--u)) 0 #febc2e, calc(14px * var(--u)) 0 #28c840; }
.pst .dv.web::after { content: ''; position: absolute; z-index: -1; inset: calc(8px * var(--u)) calc(-8px * var(--u)) calc(-8px * var(--u)) calc(8px * var(--u)); border-radius: calc(8px * var(--u)); background: var(--pa); opacity: 0.9; box-shadow: none; }
.pst .dv.web .sc { border-radius: 0 0 calc(7px * var(--u)) calc(7px * var(--u)); }
.play { position: absolute; z-index: 5; width: calc(30px * var(--s)); height: calc(30px * var(--s)); border-radius: 50%; border: 1px solid var(--blue); background: var(--paper-2); color: var(--blue); display: flex; align-items: center; justify-content: center; pointer-events: none; opacity: 0; }
.play::before { content: ''; margin-left: 2px; border-left: calc(8px * var(--s)) solid currentColor; border-top: calc(5px * var(--s)) solid transparent; border-bottom: calc(5px * var(--s)) solid transparent; }

/* 하단 캡션 */
.cap { position: absolute; z-index: 10; left: 0; right: 0; top: calc(50% + 250px * var(--s) + 14px); text-align: center; pointer-events: none; }
.cap h2 { margin: 0; font-family: var(--ko); font-weight: 700; letter-spacing: -0.02em; font-size: 30px; line-height: 1.1; }
.cap .sub { margin-top: 12px; color: var(--blue); font-weight: 500; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; }
.cap .yr { margin-top: 8px; font-weight: 500; font-size: 11px; }
.cap > * { transition: opacity 0.25s, transform 0.25s; } .cap.out > * { opacity: 0; transform: translateY(-6px); }
.arr { position: absolute; z-index: 30; top: calc(50% + 250px * var(--s) + 32px); font-size: 20px; padding: 6px 10px; line-height: 1; transition: transform 0.25s; }
.arr.l { left: calc(var(--gl) - 6px); } .arr.r { right: calc(var(--gr) - 6px); }
.arr.l:hover { transform: translateX(-4px); } .arr.r:hover { transform: translateX(4px); }
.foot { position: absolute; z-index: 20; left: 0; right: 0; bottom: 0; padding: 0 var(--gr) calc(26px + env(safe-area-inset-bottom, 0px)) var(--gl); display: flex; justify-content: space-between; font-size: 10.5px; }
.foot a { color: inherit; text-decoration: none; }
.foot .crumb { position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* 검색 버튼(포트폴리오 헤더 Search + ⌘K를 서가 스타일로): 종이 알약, 테두리를 도는 파란 빛(포트폴리오 border-beam처럼 5초에 한 바퀴) */
@property --sk-a { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
.sk-btn { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 8px 0 14px; border-radius: 999px; border: 1px solid rgba(12, 12, 12, 0.22); background: rgba(243, 242, 238, 0.6); color: var(--ink); font-family: var(--sans); font-weight: 600; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; transition: background 0.25s, border-color 0.25s; }
.sk-btn::before { content: ''; position: absolute; inset: -1px; border-radius: inherit; padding: 1.5px; pointer-events: none; animation: sk-spin 5s linear infinite;
  background: conic-gradient(from var(--sk-a), transparent 0 62%, rgba(28, 54, 148, 0.15) 70%, var(--blue) 86%, #6f8cf0 92%, transparent 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
@keyframes sk-spin { to { --sk-a: 360deg; } }
@media (prefers-reduced-motion: reduce) { .sk-btn::before { animation: none; } }
.sk-btn:hover { background: var(--paper-2); border-color: rgba(12, 12, 12, 0.4); }
.sk-ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
kbd { font-family: var(--sans); font-weight: 600; font-size: 10px; letter-spacing: 0.02em; text-transform: none; padding: 3px 7px 2px; border-radius: 999px; border: 1px solid rgba(12, 12, 12, 0.18); background: rgba(255, 255, 255, 0.55); color: var(--mute); }
/* 검색 창: 화면 가운데 종이 패널. 결과는 분류·프로젝트, 고르면 서가가 그 책으로 간다 */
.sk { position: fixed; inset: 0; width: 100%; height: 100%; max-width: none; max-height: none; margin: 0; padding: 24px 16px; border: 0; background: transparent; color: var(--ink); }
.sk[open] { display: flex; justify-content: center; align-items: flex-start; padding-top: 14vh; }
.sk::backdrop { background: rgba(40, 32, 22, 0.1); -webkit-backdrop-filter: blur(.1px); backdrop-filter: blur(.1px); }
.sk-panel { position: relative; width: min(560px, 100%); padding: 8px; border-radius: 26px; border: 1px solid rgba(255, 255, 255, 0.45);
  background: linear-gradient(180deg, rgba(248, 246, 240, 0.42), rgba(243, 242, 238, 0.28)); -webkit-backdrop-filter: blur(18px) saturate(1.7); backdrop-filter: blur(18px) saturate(1.7);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.85), inset 0 -1px 1px rgba(255, 255, 255, 0.35), 0 30px 70px rgba(40, 30, 20, 0.22), 0 2px 6px rgba(40, 30, 20, 0.08); }
/* 유리 가장자리 빛(메뉴와 같은 방식) */
.sk-panel::before { content: ''; position: absolute; inset: -1px; border-radius: inherit; padding: 1px; pointer-events: none;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.12) 35%, rgba(255, 255, 255, 0.05) 65%, rgba(255, 255, 255, 0.55));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
.sk[open] .sk-panel { animation: sk-in 0.28s cubic-bezier(0.22, 1, 0.36, 1); }
@keyframes sk-in { from { opacity: 0; transform: translateY(8px) scale(0.98); } }
.sk-field { display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 8px 0 16px; border-radius: 18px; background: rgba(255, 255, 255, 0.55); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.7), 0 1px 2px rgba(40, 30, 20, 0.06); }
.sk-field input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: none; font: 500 16px var(--ko); color: var(--ink); }
.sk-field input::placeholder { color: rgba(12, 12, 12, 0.38); }
.sk-x { flex: none; }
.sk-list { max-height: min(360px, 50svh); overflow-y: auto; overscroll-behavior: contain; padding: 6px 2px 2px; }
.sk-gl { padding: 12px 12px 6px; font: 600 10px var(--sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--mute); }
.sk-item { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 14px; cursor: pointer; }
.sk-item[aria-selected='true'] { background: rgba(255, 255, 255, 0.5); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.6); }
.sk-sw { flex: none; width: 10px; height: 30px; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.12); }
.sk-t { font: 600 15px var(--ko); white-space: nowrap; } .sk-t mark { background: none; color: var(--blue); }
.sk-s { flex: 1; min-width: 0; font-size: 11px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sk-go { flex: none; color: var(--blue); font-size: 13px; opacity: 0; } .sk-item[aria-selected='true'] .sk-go { opacity: 1; }
.sk-empty { margin: 0; padding: 40px 12px; text-align: center; color: var(--mute); font: 400 14px var(--ko); }
.sk-foot { display: flex; align-items: center; gap: 14px; padding: 10px 12px 4px; border-top: 1px solid rgba(255, 255, 255, 0.45); font: 500 11px var(--ko); color: rgba(12, 12, 12, 0.6); }
.sk-foot .c { margin-left: auto; }

/* 커서 */
.ring { position: fixed; z-index: 90; left: 0; top: 0; width: 58px; height: 58px; margin: -29px 0 0 -29px; border: 1px solid var(--ink); border-radius: 50%; pointer-events: none; display: none; align-items: center; justify-content: center; text-align: center;
  transition: width 0.3s var(--out), height 0.3s var(--out), margin 0.3s var(--out), background 0.3s, border-color 0.3s; font-weight: 600; font-size: 9px; letter-spacing: 0.08em; line-height: 1.3; color: #fff; }
.ring::before { content: ''; width: 4px; height: 4px; border-radius: 50%; background: var(--ink); transition: opacity 0.2s; }
.ring span { position: absolute; opacity: 0; transition: opacity 0.2s; }
.ring.open { width: 72px; height: 72px; margin: -36px 0 0 -36px; background: var(--blue); border-color: var(--blue); }
.ring.open::before { opacity: 0; } .ring.open span { opacity: 1; }
@media (hover: hover) and (pointer: fine) { .ring { display: flex; } }

/* 상세: 표지 자리에서 나오는 종이 */
/* 종이는 화면 크기 그대로 두고 clip-path 윤곽만 표지 자리에서 물결치며 퍼진다(상세 레이아웃은 처음부터 최종 자리) */
.sheet { position: fixed; z-index: 60; left: 0; top: 0; width: 100vw; height: 100vh; height: 100dvh; background: var(--paper-2); visibility: hidden; }
.rip { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.rip path { fill: none; stroke: #1c3694; stroke-width: 1.2; stroke-linejoin: round; opacity: 0; }
.sheet.on { visibility: visible; }
.sheet:not(.on) { pointer-events: none; }
.sheet:not(.on) .d-grid { visibility: hidden !important; }
.sheet .top, .sheet .d-grid { opacity: 0; }
.d-grid { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; align-items: center; padding: 0 clamp(24px, 9vw, 150px) 0 clamp(24px, 7vw, 100px); gap: 4vw; }
.d-info { display: flex; flex-direction: column; min-width: 0; }
.ln { display: block; overflow: hidden; }
.ln > span { display: block; transform: translateY(108%); transition: transform 0.75s var(--out); }
.ln.on > span { transform: none; }
.d-info .k { color: var(--blue); font-weight: 600; font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 22px; }
.d-info h1 { margin: 0 0 22px; font-family: var(--ko); font-weight: 700; font-size: clamp(40px, 5.2vw, 76px); line-height: 1.02; letter-spacing: -0.015em; }
.d-info .m { font-weight: 500; font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 22px; }
.d-info .p { margin: 0 0 16px; max-width: 26em; font-family: var(--ko); font-size: 15px; line-height: 1.55; word-break: keep-all; }
.d-info .e { font-family: var(--ko); color: var(--mute); font-size: 13.5px; margin-bottom: 26px; }
.d-info .go { align-self: flex-start; }
.d-info .go button { border: 1px solid var(--blue); color: var(--blue); padding: 9px 12px 8px; font-size: 10px; transition: background 0.25s, color 0.25s; }
.d-info .go button:hover { background: var(--blue); color: #fff; }
.d-cover { display: flex; justify-content: center; align-items: center; min-width: 0; }
.d-cv { position: relative; height: min(78vh, calc(745px * var(--s))); aspect-ratio: 250 / 480; max-width: 100%; filter: drop-shadow(0 18px 26px rgba(60, 45, 30, 0.3)); }
.d-cv .cv { -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-size: 0 0; mask-size: 0 0; }

@media (max-width: 760px) {

  // HOME은 MoHo 홈(저장소 루트 사이트)으로 간다

  // ===== 검색(포트폴리오 헤더 Search + ⌘K/Ctrl+K를 서가용으로): 분류·프로젝트를 찾고, 고르면 서가가 그 책으로 간다. 한글 초성 검색(ㅍㄹ → 플랫폼) =====
  var skIn = document.getElementById('sk-input'), skList = document.getElementById('sk-list'), skCount = skDlg.querySelector('.sk-foot .c'), skShown = [], skAct = 0;
  var isMac = /Mac|iPhone|iPad/.test((navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || navigator.userAgent);
  [].forEach.call(document.querySelectorAll('[data-mod]'), function (el) { el.textContent = isMac ? '⌘' : 'Ctrl'; });
  document.getElementById('sk-open').title = '검색 (' + (isMac ? '⌘' : 'Ctrl') + ' K)';
  var SKI = [];
  ['ai', 'platform', 'system', 'etc'].forEach(function (g) { var n = ITEMS.filter(function (it) { return it.g === g; }).length; SKI.push({ grp: '분류', t: GLAB[g], s: n + '권', to: ITEMS.map(function (it) { return it.g; }).indexOf(g) }); });
  ITEMS.forEach(function (it, i) { SKI.push({ grp: '프로젝트', t: it.ko, s: GLAB[it.g] + ' · ' + it.en.toUpperCase(), sw: it.th.t1, to: i }); });
  var CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
  function norm(x) { return x.toLowerCase().replace(/\s+/g, ''); }
  function cho(x) { return x.split('').map(function (ch) { var c = ch.charCodeAt(0) - 0xac00; return c >= 0 && c < 11172 ? CHO[Math.floor(c / 588)] : ch; }).join(''); }
  function score(h, q) { if (!q) return 1; var t = norm(h.t); if (t.indexOf(q) === 0) return 5; if (t.indexOf(q) >= 0) return 4; if (/^[ㄱ-ㅎ]+$/.test(q) && norm(cho(h.t)).indexOf(q) >= 0) return 3; if (norm(h.s).indexOf(q) >= 0) return 2; return 0; }
  function skRender() {
    var raw = skIn.value.trim(), q = norm(raw);
    skShown = SKI.map(function (h, i) { return { h: h, i: i, s: score(h, q) }; }).filter(function (x) { return x.s > 0; }).sort(function (a, b) { return b.s - a.s || a.i - b.i; }).map(function (x) { return x.h; });
    var groups = []; skShown.forEach(function (h) { if (groups.indexOf(h.grp) < 0) groups.push(h.grp); });
    skShown = [].concat.apply([], groups.map(function (g) { return skShown.filter(function (h) { return h.grp === g; }); }));
    skList.innerHTML = '';
    if (!skShown.length) { var e = document.createElement('p'); e.className = 'sk-empty'; e.textContent = '‘' + raw + '’에 맞는 결과가 없어요.'; skList.appendChild(e); }
    var n = 0;
    groups.forEach(function (g) {
      var box = document.createElement('div'), lab = document.createElement('div'); box.setAttribute('role', 'group'); lab.className = 'sk-gl'; lab.id = 'sk-g-' + g; lab.textContent = g; box.setAttribute('aria-labelledby', lab.id); box.appendChild(lab);
      skShown.filter(function (h) { return h.grp === g; }).forEach(function (h) {
        var o = document.createElement('div'), i = n++; o.className = 'sk-item'; o.id = 'sk-o-' + i; o.setAttribute('role', 'option'); o.dataset.i = i;
        o.innerHTML = (h.sw ? '<span class="sk-sw" style="background:' + h.sw + '"></span>' : '') + '<span class="sk-t"></span><span class="sk-s"></span><span class="sk-go" aria-hidden="true">↵</span>';
        var t = o.querySelector('.sk-t'), k = raw ? h.t.toLowerCase().indexOf(raw.toLowerCase()) : -1;
        if (k < 0) t.textContent = h.t; else { var m = document.createElement('mark'); m.textContent = h.t.slice(k, k + raw.length); t.append(h.t.slice(0, k), m, h.t.slice(k + raw.length)); }
        o.querySelector('.sk-s').textContent = h.s; box.appendChild(o);
      });
      skList.appendChild(box);
    });
    skCount.textContent = raw ? skShown.length + '개 결과' : skShown.length + '개 항목';
    skSet(0, false);
  }
  function skSet(i, scroll) {
    var os = skList.querySelectorAll('.sk-item'); if (!os.length) { skIn.removeAttribute('aria-activedescendant'); return; }
    skAct = (i + os.length) % os.length; [].forEach.call(os, function (o, j) { o.setAttribute('aria-selected', String(j === skAct)); });
    skIn.setAttribute('aria-activedescendant', os[skAct].id); if (scroll !== false) os[skAct].scrollIntoView({ block: 'nearest' });
  }
  function skGo(h) { if (!h) return; skClose(); if (opened) { closeDetail(); (function wait() { if (opened) setTimeout(wait, 60); else goTo(h.to); })(); } else goTo(h.to); } // 상세가 닫힌 뒤 이동
  function skOpenDlg() { if (skDlg.open) return; skIn.value = ''; skRender(); skDlg.showModal(); skIn.focus(); }
  function skClose() { if (skDlg.open) skDlg.close(); }
  document.getElementById('sk-open').addEventListener('click', skOpenDlg);
  document.getElementById('sk-close').addEventListener('click', skClose);
  skDlg.addEventListener('click', function (e) { if (e.target === skDlg) skClose(); });
  document.addEventListener('keydown', function (e) { if ((e.metaKey || e.ctrlKey) && !e.altKey && !e.shiftKey && (e.code === 'KeyK' || e.key.toLowerCase() === 'k')) { e.preventDefault(); skDlg.open ? skClose() : skOpenDlg(); } });
  skIn.addEventListener('input', skRender);
  skIn.addEventListener('keydown', function (e) {
    if (e.isComposing) return; // 한글 조합 중 Enter는 무시
    if (e.key === 'ArrowDown') { e.preventDefault(); skSet(skAct + 1); } else if (e.key === 'ArrowUp') { e.preventDefault(); skSet(skAct - 1); } else if (e.key === 'Enter') { e.preventDefault(); skGo(skShown[skAct]); }
  });
  skList.addEventListener('mousemove', function (e) { var o = e.target.closest('.sk-item'); if (o && +o.dataset.i !== skAct) skSet(+o.dataset.i, false); });
  skList.addEventListener('click', function (e) { var o = e.target.closest('.sk-item'); if (o) skGo(skShown[+o.dataset.i]); });


  function resize() { S = Math.max(0.5, Math.min(1, innerWidth / 1440, innerHeight / 960)); root.style.setProperty('--s', S); lastS = -1; }
  addEventListener('resize', resize); resize();
  requestAnimationFrame(tick);
})();
