/* 레이아웃(원본 1440×960 실측): 3D 비디오 케이스 상자(정면 책등 78 × 깊이 250 × 높이 465)를 3.5° 기울여 세운 서가. 선택한 상자는 -86° 돌아 표지가 정면. 넘김은 프레임마다 목표를 따라가는 감속(계수 0.068/60fps) */
:root {
  --paper: #e7e5df; --paper-2: #f3f2ee; --ink: #0c0c0c; --blue: #1c3694; --mute: #6b6a66;
  /* 제목용 명조: 함렛 확정(2026-11-18). --kr-w: 책등·로고 굵기, --kr-h: 큰 제목 굵기 */
  --kr: 'Hahmlet', Georgia, serif; --kr-w: 700; /* 함렛: 제목(OSOL LIBRARY)과 영문 메뉴명만 */
  --ko: 'OsolSans', 'Noto Sans KR', system-ui, sans-serif; /* 한글: SUIT(파일 안에 쓰인 글자만 담은 부분 글꼴) */
  --display: 'Playfair Display', 'Noto Serif KR', Georgia, serif;
  --sans: 'Inter', 'OsolSans', 'Noto Sans KR', system-ui, sans-serif;
