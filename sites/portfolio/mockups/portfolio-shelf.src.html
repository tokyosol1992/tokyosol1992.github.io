<style>
/* 레이아웃(1440×960 기준 실측): 중앙에 책등 서가(책등 78×465, 간격 93), 선택한 책은 표지(250×480)로 꺼내지고 아래에 제목·부제·연도, 좌우 화살표, 위에 헤더와 필터 */
:root {

  --ease: cubic-bezier(0.2, 0.8, 0.1, 1);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); }

.paper { position: fixed; inset: 0; pointer-events: none; z-index: 60; opacity: 0.5; mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .42  0 0 0 0 .36  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

  transition: transform 0.95s var(--ease), width 0.95s var(--ease), height 0.95s var(--ease), opacity 0.6s; opacity: 1; display: block; text-align: left; }

.cv .mk2 { position: absolute; left: 7%; bottom: 3.6%; font-family: var(--sans); font-weight: 600; font-size: calc(7.5px * var(--s)); letter-spacing: 0.2em; z-index: 2; }

/* 하단 캡션 */
.cap { position: absolute; z-index: 10; left: 0; right: 0; top: calc(50% + 252px * var(--s) + 20px); text-align: center; pointer-events: none; }

.foot { position: absolute; z-index: 20; left: 0; right: 0; bottom: 0; padding: 0 var(--gr) calc(26px + env(safe-area-inset-bottom, 0px)) var(--gl); display: flex; justify-content: space-between; font-size: 10.5px; }

.ring { position: fixed; z-index: 90; left: 0; top: 0; width: 58px; height: 58px; margin: -29px 0 0 -29px; border: 1px solid var(--ink); border-radius: 50%; pointer-events: none; display: none; align-items: center; justify-content: center; text-align: center;
  transition: width 0.3s var(--ease), height 0.3s var(--ease), margin 0.3s var(--ease), background 0.3s, border-color 0.3s, color 0.3s; font-family: var(--sans); font-weight: 600; font-size: 9px; letter-spacing: 0.08em; line-height: 1.3; color: #fff; }
.ring::before { content: ''; width: 4px; height: 4px; border-radius: 50%; background: var(--ink); transition: opacity 0.2s; }
